name: Build SD card image

on:
  push:
    tags: ["v*"]
    branches-ignore: [main]
    paths: ["image/**", "piholegotchi/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-binfmt parted xz-utils e2fsprogs
          ls /proc/sys/fs/binfmt_misc/ | grep -i arm

      - name: Build image
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/piholegotchi.img.xz
        run: sudo --preserve-env=RELEASE_URL image/build.sh

      - name: Upload (branch builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: piholegotchi-image
          path: out/
          compression-level: 0
          retention-days: 14

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/piholegotchi.img.xz out/piholegotchi.img.xz.sha256 \
            out/piholegotchi.rpi-imager-manifest \
            --title "Piholegotchi $GITHUB_REF_NAME" \
            --notes "Download piholegotchi.rpi-imager-manifest and double-click it to open Raspberry Pi Imager with Piholegotchi ready to flash. See the README for the full steps."
