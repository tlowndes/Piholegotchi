name: Build SD card image

on:
  push:
    tags: ["v*"]
    branches-ignore: [main]
    paths: ["image/**", "piholegotchi/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static binfmt-support parted xz-utils e2fsprogs

      - name: Build image
        run: sudo image/build.sh

      - name: Upload (branch builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: piholegotchi-image
          path: out/
          compression-level: 0
          retention-days: 14

      - name: Publish release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/piholegotchi.img.xz out/piholegotchi.img.xz.sha256 \
            --title "Piholegotchi $GITHUB_REF_NAME" \
            --notes "Flash piholegotchi.img.xz with Raspberry Pi Imager (Use custom). See the README for setup."
