<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Piholegotchi</title>
<link rel="stylesheet" href="widget.css">
</head>
<body class="edge-right mode-tucked">
  <div id="drawer" class="drawer" hidden role="dialog" aria-label="Muncher's drawer">
    <aside class="homecol" id="homecol">
      <canvas id="petc" width="140" height="100" aria-label="Muncher"></canvas>
      <div class="name">Muncher</div>
      <div class="status" id="status"></div>
      <div class="says" id="says"></div>
      <span class="sp"></span>
      <div class="foot">
        <button class="tuck" id="tuck"><span>Tuck away</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <button class="ibtn" id="gear" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </aside>
    <div class="maincol">
      <div class="tabs" id="tabs" role="tablist" aria-label="Muncher's tabs"></div>
      <div class="page" id="page" role="tabpanel"></div>
    </div>
  </div>

  <div id="peek" class="peek">
    <div class="bubble" id="bubble" hidden role="button" tabindex="0"><b id="bt"></b><span id="bm"></span><button class="x" id="bx" aria-label="Dismiss"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="handle" id="handle" role="button" tabindex="0" aria-label="Muncher. Tap to slide the drawer out, hold to move him up or down"><canvas id="peekc" width="140" height="100"></canvas><span class="dot" id="dot" hidden></span></div>
  </div>
  <script src="muncher.js"></script>
  <script src="demo.js"></script>
  <script src="screens.js"></script>
  <script src="widget.js"></script>
</body>
</html>
